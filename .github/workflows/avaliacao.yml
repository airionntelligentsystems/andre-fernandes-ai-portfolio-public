name: Avaliação do laboratório

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m portfolio_lab.evaluate --output evidence/evaluation.json
      - run: python -m portfolio_lab.mcp_probe
      - run: python -m portfolio_lab.execution_probe --output evidence/execution.json
      - run: python -m portfolio_lab.datasets --output evidence/datasets
